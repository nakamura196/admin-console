name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: 'pages-deploy'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare
        run: npm run build:cloudflare

      - name: Prepare for Pages deploy
        run: |
          cp .open-next/worker.js .open-next/_worker.js
          cp -r .open-next/assets/. .open-next/
          cp scripts/_routes.json .open-next/_routes.json

      # Pages プロジェクト名は、リポジトリ変数 CF_PAGES_PROJECT があればそれを使い、
      # 無ければリポジトリ名を使う。テンプレートから複製したときに直書きを消して回らずに済む。
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy .open-next \
            --project-name "${{ vars.CF_PAGES_PROJECT || github.event.repository.name }}" \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "${GITHUB_SHA}"
